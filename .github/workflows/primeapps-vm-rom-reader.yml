name: PrimeApps VM - Real ROM filesystem tests
on:
  push:
    branches:
      - feature/primeapps-vm-real-rom-reader-20261028
    paths:
      - 'primeapps-vm/rom-engine/**'
      - '.github/workflows/primeapps-vm-rom-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rom-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ext4 filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs qemu-utils
          command -v mke2fs
          command -v debugfs
          command -v qemu-img
          command -v qemu-io
      - name: Validate ROM reader and build/read ext4 guest image
        run: |
          set -euo pipefail
          python -m compileall -q primeapps-vm/rom-engine
          cd primeapps-vm/rom-engine
          python -m unittest discover -s . -p 'test_*.py' -v
