name: Prime Player LAB10 - Performance Diagnostics
on:
  push:
    branches: [perf/prime-player-lab10-webview-20261029]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify original PWA player is not replaced
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/primeapps/webplayer/MainActivity.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assets = Path('app/src/main/assets')
          assert 'https://primeappswebplayer.lovable.app/' in main
          assert 'web.loadUrl(START_URL)' in main
          assert 'web.addJavascriptInterface(' not in main
          assert 'browser.addJavascriptInterface(' not in main
          assert 'web.evaluateJavascript(script' not in main
          assert 'onShowCustomView' in main and 'onHideCustomView' in main
          assert 'onShowFileChooser' in main
          assert 'android:supportsPictureInPicture=' not in manifest
          assert 'android.software.picture_in_picture' not in manifest
          assert 'media3' not in gradle
          assert "minSdk 21" in gradle and "versionCode 10" in gradle
          for name in ('same_player.js', 'vod_popup.js'):
              assert not (assets / name).exists(), name
          for name in ('NativeVideoActivity.java', 'FloatingPlayback.java', 'StreamHttp.java'):
              assert not (Path('app/src/main/java/com/primeapps/webplayer') / name).exists(), name
          assert 'WebChromeClient' in main and 'setDomStorageEnabled(true)' in main
          assert 'setCacheMode(WebSettings.LOAD_DEFAULT)' in main
          assert 'onPageCommitVisible' in main
          assert 'setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false)' in main
          assert 'MEDIA_TIMING_SCRIPT' in main
          assert 'showDiagnostics()' in main
          assert 'setMediaPlaybackRequiresUserGesture(false)' in main
          assert 'web.addJavascriptInterface(new' not in main
          assert 'getEntriesByType' in main
          assert 'PRIME_PLAYER_LAB10' not in main
          print('LAB10 OK: original PWA, no player overrides, no popup')
          PY
      - name: Compile signed debug and unsigned release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify APK and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|application-label:|sdkVersion:|targetSdkVersion:"
      - uses: actions/upload-artifact@v4
        with:
          name: PRIME_PLAYER_LAB10_ASSINADO_TESTE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: PRIME_PLAYER_LAB10_SEM_ASSINAR
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
