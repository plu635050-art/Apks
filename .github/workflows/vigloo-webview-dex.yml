name: Vigloo WebView - compilar Activity isolada
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 36 e D8
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar Java e DEX (sem incluir o APK de terceiros)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d build/classes vigloo-webview/src/com/primeapps/vigloo/PrimeAuthActivity.java
          find build/classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output build/dex
          test -s build/dex/classes.dex
          python3 - <<'PY'
          import hashlib,struct,zlib
          b=open('build/dex/classes.dex','rb').read()
          assert b[:4] == bytes((100,101,120,10)) and b[7] == 0
          assert struct.unpack_from('<I',b,8)[0] == zlib.adler32(b[12:]) & 0xffffffff
          assert b[12:32] == hashlib.sha1(b[32:]).digest()
          print('DEX validado; bytes',len(b),'classes',struct.unpack_from('<I',b,0x60)[0])
          PY
      - name: Publicar classes.dex do launcher
        uses: actions/upload-artifact@v4
        with:
          name: Vigloo-Prime-WebView-DEX-LAB1
          path: build/dex/classes.dex
          retention-days: 7
          if-no-files-found: error
