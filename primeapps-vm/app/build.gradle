plugins {
    id 'com.android.application'
}
android {
    namespace 'shop.primepsusiv.vm'
    compileSdk 36

    defaultConfig {
        applicationId 'shop.primepsusiv.vm'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-lab1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
