plugins { id 'com.android.application' }
android {
    namespace 'com.primeapps.webplayer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.primeapps.webplayer'
        minSdk 21
        targetSdk 35
        versionCode 8
        versionName '1.0.0-lab8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
